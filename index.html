<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SYSTEM_ERROR.exe</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Courier New", monospace;
}

.screen {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background:
        radial-gradient(
            ellipse at center,
            #151515 0%,
            #070707 45%,
            #000 100%
        );
}

.screen::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.045) 0px,
            rgba(255,255,255,0.045) 1px,
            transparent 2px,
            transparent 5px
        );

    z-index: 50;
    pointer-events: none;
}

.noise {
    position: absolute;
    inset: 0;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0px,
            rgba(255,0,0,.025) 2px,
            transparent 4px,
            rgba(0,255,255,.025) 6px,
            transparent 8px
        );

    opacity: .8;
    animation: noiseMove .08s infinite;
    pointer-events: none;
    z-index: 40;
}

@keyframes noiseMove {
    0% {
        transform: translate(0,0);
    }

    25% {
        transform: translate(-2px,1px);
    }

    50% {
        transform: translate(2px,-1px);
    }

    75% {
        transform: translate(-1px,-2px);
    }

    100% {
        transform: translate(1px,2px);
    }
}

/* =====================================
   OJOS TÉTRICOS
===================================== */

.eye {
    position: absolute;

    width: 95px;
    height: 48px;

    border-radius: 50% / 60%;

    background:
        radial-gradient(
            ellipse at center,
            #050505 0%,
            #080808 18%,
            #252525 32%,
            #090909 58%,
            transparent 72%
        );

    box-shadow:
        0 0 12px rgba(255,255,255,.12),
        0 0 30px rgba(255,255,255,.04);

    opacity: .55;

    z-index: 8;

    transform: rotate(-3deg);

    animation: eyeFlicker 4s infinite;
}

.eye::before {
    content: "";

    position: absolute;

    width: 21px;
    height: 32px;

    left: 37px;
    top: 8px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #000 0%,
            #000 55%,
            #111 75%,
            #333 100%
        );

    box-shadow:
        0 0 5px #000,
        0 0 12px rgba(0,0,0,.9);
}

.eye::after {
    content: "";

    position: absolute;

    width: 5px;
    height: 7px;

    left: 43px;
    top: 13px;

    border-radius: 50%;

    background: rgba(255,255,255,.18);
}

.eye1 {
    top: 8%;
    left: 7%;
    transform: rotate(-8deg) scale(.8);
}

.eye2 {
    top: 14%;
    right: 7%;
    transform: rotate(8deg) scale(.95);
    animation-delay: .8s;
}

.eye3 {
    top: 38%;
    left: 2%;
    transform: rotate(-4deg) scale(.7);
    animation-delay: 1.4s;
}

.eye4 {
    top: 43%;
    right: 2%;
    transform: rotate(7deg) scale(.75);
    animation-delay: 2s;
}

.eye5 {
    bottom: 14%;
    left: 8%;
    transform: rotate(6deg) scale(.9);
    animation-delay: .4s;
}

.eye6 {
    bottom: 8%;
    right: 8%;
    transform: rotate(-7deg) scale(.8);
    animation-delay: 1.7s;
}

.eye7 {
    top: 28%;
    left: 22%;
    transform: rotate(-5deg) scale(.45);
    opacity: .25;
}

.eye8 {
    bottom: 28%;
    right: 22%;
    transform: rotate(5deg) scale(.5);
    opacity: .25;
}

@keyframes eyeFlicker {

    0%, 70%, 100% {
        opacity: .42;
    }

    72% {
        opacity: .7;
    }

    74% {
        opacity: .15;
    }

    76% {
        opacity: .55;
    }
}

/* =====================================
   GLITCHES HORIZONTALES
===================================== */

.glitch {
    position: absolute;

    height: 3px;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(0,255,255,.8),
        rgba(255,0,50,.8),
        transparent
    );

    z-index: 12;

    animation: glitch .7s infinite steps(2);
}

.g1 {
    width: 180px;
    top: 18%;
    left: 2%;
}

.g2 {
    width: 260px;
    top: 29%;
    right: 0;
    animation-delay: .3s;
}

.g3 {
    width: 150px;
    bottom: 21%;
    left: 0;
    animation-delay: .5s;
}

.g4 {
    width: 230px;
    bottom: 10%;
    right: 3%;
    animation-delay: .8s;
}

@keyframes glitch {

    0% {
        transform: translateX(0);
        opacity: .15;
    }

    30% {
        transform: translateX(30px);
        opacity: .7;
    }

    31% {
        transform: translateX(-25px);
        opacity: .2;
    }

    60% {
        transform: translateX(10px);
        opacity: .4;
    }

    100% {
        transform: translateX(0);
        opacity: .1;
    }
}

/* =====================================
   VIDRIO ROTO
===================================== */

.crack {
    position: absolute;

    height: 430px;
    width: 2px;

    background: linear-gradient(
        to bottom,
        transparent,
        rgba(255,255,255,.65),
        rgba(255,255,255,.15),
        transparent
    );

    z-index: 45;

    opacity: .65;
    transform-origin: top;
}

.crack1 {
    left: 13%;
    top: -80px;
    transform: rotate(43deg);
}

.crack2 {
    right: 15%;
    top: -60px;
    transform: rotate(-48deg);
}

.crack3 {
    left: 8%;
    bottom: -130px;
    transform: rotate(-38deg);
}

.crack4 {
    right: 8%;
    bottom: -100px;
    transform: rotate(45deg);
}

.crack5 {
    left: 50%;
    top: 0;
    height: 250px;
    transform: rotate(87deg);
}

/* =====================================
   VENTANA
===================================== */

.error-window {

    position: absolute;

    width: min(850px, 88vw);

    left: 50%;
    top: 53%;

    transform: translate(-50%, -50%);

    border: 3px solid #0754c9;

    background: #e9e9e9;

    box-shadow:
        10px 10px 0 rgba(0,0,0,.5),
        0 0 30px rgba(0,60,255,.2);

    z-index: 20;

    animation: windowShake 5s infinite;
}

/* =====================================
   BARRA AZUL
===================================== */

.titlebar {

    height: 58px;

    display: flex;
    align-items: center;

    padding: 0 15px;

    color: white;

    font-family: Arial, sans-serif;

    font-size: 22px;

    background:
        linear-gradient(
            #0966d9,
            #0345a9
        );
}

.window-icon {

    width: 25px;
    height: 25px;

    margin-right: 10px;

    background: #eee;

    border: 1px solid #aaa;
}

.title {
    flex: 1;
}

.close {
    font-size: 25px;
}

/* =====================================
   CONTENIDO
===================================== */

.content {

    text-align: center;

    padding: 50px 35px 65px;

    background:
        repeating-linear-gradient(
            0deg,
            #eeeeee 0px,
            #eeeeee 2px,
            #e6e6e6 3px
        );

    min-height: 430px;
}

.system {

    font-size: 21px;

    letter-spacing: 2px;

    margin-bottom: 42px;

    color: #111;

    white-space: nowrap;
}

/* =====================================
   EL FINAL
===================================== */

.final {

    display: block;

    position: relative;

    width: 100%;

    font-family: Arial, Helvetica, sans-serif;

    font-size: clamp(58px, 9vw, 120px);

    font-weight: 900;

    letter-spacing: 3px;

    line-height: .95;

    color: #050505;

    text-align: center;

    text-shadow:
        -6px 0 #00ffff,
        6px 0 #ff003c;

    animation: finalGlitch 1.8s infinite steps(2);
}

@keyframes finalGlitch {

    0%, 80%, 100% {
        transform: translateX(0);
    }

    81% {
        transform: translateX(-5px);
    }

    82% {
        transform: translateX(6px);
    }

    83% {
        transform: translateX(-2px);
    }
}

/* =====================================
   TE ESTAMOS ESPERANDO
===================================== */

.waiting {

    display: block;

    width: 100%;

    margin-top: 48px;

    text-align: center;

    font-family: "Courier New", monospace;

    font-size: clamp(19px, 3vw, 32px);

    font-weight: normal;

    letter-spacing: 3px;

    line-height: 1.2;

    white-space: nowrap;

    color: #111;

    text-shadow: none;

    animation: waitingGlitch 4s infinite steps(2);
}

@keyframes waitingGlitch {

    0%, 90%, 100% {
        transform: translateX(0);
        opacity: 1;
    }

    91% {
        transform: translateX(4px);
        opacity: .6;
    }

    92% {
        transform: translateX(-4px);
        opacity: .9;
    }
}

/* =====================================
   MOVIMIENTO DE VENTANA
===================================== */

@keyframes windowShake {

    0%, 94%, 100% {
        transform: translate(-50%, -50%);
    }

    95% {
        transform: translate(calc(-50% + 4px), -50%);
    }

    96% {
        transform: translate(calc(-50% - 5px), -50%);
    }

    97% {
        transform: translate(-50%, -50%);
    }
}

/* =====================================
   MÓVIL
===================================== */

@media (max-width: 600px) {

    .error-window {
        width: 91vw;
        top: 52%;
    }

    .titlebar {
        height: 48px;
        font-size: 17px;
        padding: 0 10px;
    }

    .window-icon {
        width: 19px;
        height: 19px;
    }

    .content {
        min-height: 350px;
        padding: 42px 15px 45px;
    }

    .system {
        font-size: 13px;
        letter-spacing: 1px;
        margin-bottom: 38px;
    }

    .final {
        font-size: 51px;
        letter-spacing: 1px;

        text-shadow:
            -4px 0 #00ffff,
            4px 0 #ff003c;
    }

    .waiting {
        margin-top: 40px;

        font-size: 18px;

        letter-spacing: 1.5px;
    }

    .eye {
        opacity: .48;
    }

    .eye1 {
        left: 1%;
        top: 10%;
    }

    .eye2 {
        right: 1%;
        top: 17%;
    }

    .eye3 {
        left: -5%;
        top: 42%;
    }

    .eye4 {
        right: -5%;
        top: 43%;
    }

    .eye5 {
        left: 0;
        bottom: 10%;
    }

    .eye6 {
        right: 0;
        bottom: 7%;
    }

    .eye7,
    .eye8 {
        opacity: .2;
    }

    .crack {
        opacity: .55;
    }
}

</style>
</head>

<body>

<div class="screen">

    <!-- OJOS -->
    <div class="eye eye1"></div>
    <div class="eye eye2"></div>
    <div class="eye eye3"></div>
    <div class="eye eye4"></div>
    <div class="eye eye5"></div>
    <div class="eye eye6"></div>
    <div class="eye eye7"></div>
    <div class="eye eye8"></div>

    <!-- GLITCHES -->
    <div class="glitch g1"></div>
    <div class="glitch g2"></div>
    <div class="glitch g3"></div>
    <div class="glitch g4"></div>

    <!-- PANTALLA ROTA -->
    <div class="crack crack1"></div>
    <div class="crack crack2"></div>
    <div class="crack crack3"></div>
    <div class="crack crack4"></div>
    <div class="crack crack5"></div>

    <!-- VENTANA -->
    <div class="error-window">

        <div class="titlebar">

            <div class="window-icon"></div>

            <div class="title">
                SYSTEM_ERROR.exe
            </div>

            <div class="close">
                ×
            </div>

        </div>

        <div class="content">

            <div class="system">
                SYSTEM://CONNECTION_TERMINATED
            </div>

            <div class="final">
                EL FINAL
            </div>

            <div class="waiting">
                ACTUALIZACION FINAL, SÁBADO 5 DE SEPTIEMBRE. 
            </div>

        </div>

    </div>

    <!-- RUIDO -->
    <div class="noise"></div>

</div>

</body>
</html>

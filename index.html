<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>¿Una segunda vez?</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    overflow:hidden;
    color:white;
}

.background{
    position:fixed;
    inset:0;
    background:url("https://i.imgur.com/875LyNx.png") center center/cover no-repeat;
    filter:brightness(45%);
    z-index:-2;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    z-index:-1;
}

.container{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.subtitle{
    font-size:22px;
    letter-spacing:5px;
    opacity:.75;
    margin-bottom:25px;
    text-transform:uppercase;
}

h1{
    font-size:58px;
    font-weight:300;
    text-shadow:0 0 15px black;
    margin-bottom:45px;
}

#countdown{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
}

.box{
    background:rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(3px);
    padding:18px;
    min-width:95px;
}

.number{
    font-size:42px;
    font-weight:bold;
}

.label{
    font-size:12px;
    letter-spacing:2px;
    opacity:.7;
    margin-top:5px;
}
</style>

</head>
<body>

<div class="background"></div>
<div class="overlay"></div>

<div class="container">

<div class="subtitle">
No hay elección
</div>

<h1>
¿Una segunda vez?
</h1>

<div id="countdown">

<div class="box">
<div id="days" class="number">00</div>
<div class="label">DÍAS</div>
</div>

<div class="box">
<div id="hours" class="number">00</div>
<div class="label">HORAS</div>
</div>

<div class="box">
<div id="minutes" class="number">00</div>
<div class="label">MINUTOS</div>
</div>

<div class="box">
<div id="seconds" class="number">00</div>
<div class="label">SEGUNDOS</div>
</div>

</div>

</div>

<script>

const targetDate = new Date("2026-07-04T11:20:00-04:00").getTime();

function updateCountdown(){

const now = new Date().getTime();
const distance = targetDate-now;

if(distance<=0){

document.getElementById("countdown").innerHTML="<h2>EL TIEMPO HA TERMINADO</h2>";
return;

}

const days=Math.floor(distance/(1000*60*60*24));
const hours=Math.floor((distance%(1000*60*60*24))/(1000*60*60));
const minutes=Math.floor((distance%(1000*60*60))/(1000*60));
const seconds=Math.floor((distance%(1000*60))/1000);

document.getElementById("days").textContent=String(days).padStart(2,"0");
document.getElementById("hours").textContent=String(hours).padStart(2,"0");
document.getElementById("minutes").textContent=String(minutes).padStart(2,"0");
document.getElementById("seconds").textContent=String(seconds).padStart(2,"0");

}

updateCountdown();
setInterval(updateCountdown,1000);

</script>

</body>
</html>
